<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Lab Framework</title>
  <link rel="stylesheet" href="framework-style.css">
</head>
<body>

  <!-- The single mount point for the framework engine -->
  <div id="qc-framework-root"></div>

  <!-- Framework Engine Script -->
  <script src="framework-engine.js"></script>
  
  <!-- Module Data Scripts -->
  <script src="modules/gmb-core-density.js"></script>

  <!-- Mount Engine -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Instantiate Framework
      window.QC = new QCLabFramework("qc-framework-root");
      
      // Mount Core Density Module
      window.QC.mountModule(gmbCoreDensityModule);
    });
  </script>
</body>
</html>
