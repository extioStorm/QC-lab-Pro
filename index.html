<!--
  QC Lab Procedural App - Entry Point
  
  AI CONTEXT: See modules/registry.js for application architecture
  and cross-file contracts.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Lab Procedural App</title>

  <!-- Eruda Dev Tools (Mobile Debugger) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- Framework Styles -->
  <link rel="stylesheet" href="framework-style.css">
</head>
<body>

  <!-- Top App Bar / Header -->
  <header class="app-header">
    <button id="menu-toggle" class="icon-btn" aria-label="Open Navigation">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <h1 class="app-title">QC Lab Framework</h1>
  </header>

  <!-- Navigation Drawer Overlay -->
  <div id="nav-overlay" class="nav-overlay"></div>

  <!-- Navigation Drawer -->
  <aside id="nav-drawer" class="nav-drawer">
    <div class="nav-header">
      <h2>Navigation</h2>
    </div>
    <nav id="navigation-tree" class="navigation-tree">
      <!-- Dynamically generated navigation tree -->
    </nav>
  </aside>

  <!-- Main Application Root Container -->
  <main id="qc-framework-root" class="framework-root-container">
    <!-- framework-engine.js mounts active modules here -->
  </main>

  <!-- Core Scripts -->
  <script src="framework-engine.js"></script>
  <script src="modules/registry.js?v=1.0.0"></script>

  <!-- Application Setup & Navigation Script -->
  <script>
    // Timestamp-based script loader.
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const cleanSrc = src.split('?')[0];
        const cacheBustedSrc = `${cleanSrc}?v=${Date.now()}`;

        if (document.querySelector(`script[src^="${cleanSrc}"]`)) {
          return resolve();
        }

        const script = document.createElement("script");
        script.src = cacheBustedSrc;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load script: ${cacheBustedSrc}`));
        document.body.appendChild(script);
      });
    }

    function closeNavigation() {
      document.getElementById("nav-drawer").classList.remove("open");
      document.getElementById("nav-overlay").classList.remove("active");
    }

    function clearActiveNavigation() {
      document.querySelectorAll("#navigation-tree .nav-item.active")
        .forEach(el => el.classList.remove("active"));
    }

    function createNavItem(label, className, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = label;
      if (onClick) button.addEventListener("click", onClick);
      return button;
    }

    function renderNavigationTree() {
      const container = document.getElementById("navigation-tree");
      container.innerHTML = "";

      const sections = [...(window.QC_NAVIGATION?.sections || [])]
        .sort((a, b) => (a.sequence || 0) - (b.sequence || 0));

      for (const section of sections) {
        const sectionBlock = document.createElement("section");
        sectionBlock.className = "nav-section";
        sectionBlock.dataset.sectionId = section.id;

        const sectionButton = createNavItem(
          section.title,
          "nav-section-title",
          () => sectionBlock.classList.toggle("expanded")
        );
        sectionButton.setAttribute("aria-expanded", "true");
        sectionBlock.classList.add("expanded");

        const sectionChildren = document.createElement("div");
        sectionChildren.className = "nav-section-children";

        // 1. WORKDAY CHRONOLOGICAL PROJECTION
        if (section.childrenFrom === "QC_MODULES_WORKDAY") {
          const workdayModules = [...(window.QC_MODULES || [])]
            .sort((a, b) => (a.workflow?.chronologicalOrder || 0) - (b.workflow?.chronologicalOrder || 0));

          const workdayGroup = document.createElement("div");
          workdayGroup.className = "nav-group expanded";

          const workdayGroupChildren = document.createElement("div");
          workdayGroupChildren.className = "nav-group-children";

          workdayModules.forEach(item => {
            const moduleButton = createNavItem(
              `⏱️ ${item.title}`,
              "nav-item nav-indent-1",
              () => {
                const moduleData = window.QC_LOADED_MODULES?.[item.id];

                if (!moduleData) {
                  console.warn(`Module "${item.id}" is not loaded yet.`);
                  return;
                }

                clearActiveNavigation();
                moduleButton.classList.add("active");
                window.QC.mountModule(moduleData);
                closeNavigation();
              }
            );

            moduleButton.dataset.moduleId = item.id;
            workdayGroupChildren.appendChild(moduleButton);
          });

          workdayGroup.appendChild(workdayGroupChildren);
          sectionChildren.appendChild(workdayGroup);

        // 2. STANDARD LAB TAXONOMY PROJECTION (Testing)
        } else if (section.childrenFrom === "QC_MODULES") {
          const modules = [...(window.QC_MODULES || [])]
            .filter(item => item.navigation?.section === section.id)
            .sort((a, b) => (a.navigation?.sequence || 0) - (b.navigation?.sequence || 0));

          const modulesGroup = document.createElement("div");
          modulesGroup.className = "nav-group expanded";

          const modulesButton = createNavItem(
            "Modules",
            "nav-group-title",
            () => modulesGroup.classList.toggle("expanded")
          );
          modulesButton.setAttribute("aria-expanded", "true");
          modulesGroup.appendChild(modulesButton);

          const categoryGroups = new Map();

          for (const item of modules) {
            const nav = item.navigation || {};
            const categoryId = nav.category || "other";
            const categoryTitle = nav.categoryTitle || categoryId;

            if (!categoryGroups.has(categoryId)) {
              categoryGroups.set(categoryId, {
                title: categoryTitle,
                sequence: nav.categorySequence || 0,
                modules: []
              });
            }

            categoryGroups.get(categoryId).modules.push(item);
          }

          const sortedCategories = [...categoryGroups.values()]
            .sort((a, b) => a.sequence - b.sequence);

          const categoriesChildren = document.createElement("div");
          categoriesChildren.className = "nav-group-children";

          for (const category of sortedCategories) {
            const catGroup = document.createElement("div");
            catGroup.className = "nav-category expanded";

            const catTitle = createNavItem(
              category.title,
              "nav-category-title nav-indent-1",
              () => catGroup.classList.toggle("expanded")
            );
            catTitle.setAttribute("aria-expanded", "true");
            catGroup.appendChild(catTitle);

            const catChildren = document.createElement("div");
            catChildren.className = "nav-category-children";

            category.modules.forEach(item => {
              const moduleButton = createNavItem(
                item.title,
                "nav-item nav-indent-2",
                () => {
                  const moduleData = window.QC_LOADED_MODULES?.[item.id];

                  if (!moduleData) {
                    console.warn(`Module "${item.id}" is not loaded yet.`);
                    return;
                  }

                  clearActiveNavigation();
                  moduleButton.classList.add("active");
                  window.QC.mountModule(moduleData);
                  closeNavigation();
                }
              );

              moduleButton.dataset.moduleId = item.id;
              catChildren.appendChild(moduleButton);
            });

            catGroup.appendChild(catChildren);
            categoriesChildren.appendChild(catGroup);
          }

          modulesGroup.appendChild(categoriesChildren);
          sectionChildren.appendChild(modulesGroup);
        }

        sectionBlock.appendChild(sectionButton);
        sectionBlock.appendChild(sectionChildren);
        container.appendChild(sectionBlock);
      }
    }

    async function initApp() {
      // 1. Instantiate Core Engine Singleton
      window.QC = new QCLabFramework("qc-framework-root");

      // 2. Setup Navigation Drawer Controls
      const menuToggle = document.getElementById("menu-toggle");
      const navDrawer = document.getElementById("nav-drawer");
      const navOverlay = document.getElementById("nav-overlay");

      if (menuToggle) {
        menuToggle.addEventListener("click", () => {
          navDrawer.classList.toggle("open");
          navOverlay.classList.toggle("active");
        });
      }

      if (navOverlay) {
        navOverlay.addEventListener("click", closeNavigation);
      }

      // 3. Render Navigation Tree
      renderNavigationTree();

      // 4. Asynchronously Load Module Scripts Defined in Registry
      window.QC_LOADED_MODULES = {};

      if (Array.isArray(window.QC_MODULES)) {
        for (const item of window.QC_MODULES) {
          if (item.file) {
            try {
              await loadScript(item.file);
            } catch (err) {
              console.error(`Error loading module ${item.id}:`, err);
            }
          }
        }
      }

      // 5. Auto-Mount First Available Module
      if (window.QC_MODULES && window.QC_MODULES.length > 0) {
        const firstModuleId = window.QC_MODULES[0].id;
        const firstModuleData = window.QC_LOADED_MODULES[firstModuleId];

        if (firstModuleData) {
          window.QC.mountModule(firstModuleData);

          const firstNavBtn = document.querySelector(`[data-module-id="${firstModuleId}"]`);
          if (firstNavBtn) {
            firstNavBtn.classList.add("active");
          }
        }
      }
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
