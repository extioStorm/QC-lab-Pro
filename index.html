<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asphalt QC Field System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header>
  <div class="top-bar">
    <div class="logo">QC FIELD ENGINE</div>
    <div class="badge">OFFLINE READY</div>
  </div>

  <div class="module-select-wrapper">
    <select id="mobile-module-select" class="mobile-nav" onchange="selectModule(this.value)">
      <option>Loading modules...</option>
    </select>
  </div>
</header>

<div class="toolbar">
  <div class="project-meta">
    <span>ACTIVE JOB #:</span>
    <input type="text" id="project-id-input" value="JOB-2173" onchange="switchProject(this.value)">
  </div>

  <div id="context-bar"></div>

  <div class="mode-selector">
    <button class="mode-btn active" data-mode="INTERACTIVE" onclick="setMode('INTERACTIVE')">Step Wizard</button>
    <button class="mode-btn" data-mode="SPEED" onclick="setMode('SPEED')">Speed Sheet</button>
  </div>
</div>

<main>
  <div class="container" id="app-viewport"></div>
</main>

<!-- Order matters: engine, then data model, then screen code, then modules. -->
<script src="js/engine.js"></script>
<script src="js/model.js"></script>
<script src="js/app.js"></script>
<script src="modules/gmb-density.js"></script>
<script src="modules/rice-test.js"></script>

<script>
  // Show the empty "where am I" bar even before any module finishes loading.
  renderNavigation();
  processAndRender();
</script>

</body>
</html>
