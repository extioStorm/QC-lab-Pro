<!-- Replace your drawer content inside <div id="nav-drawer" class="nav-drawer"> -->
<h3 class="drawer-title">Test Modules</h3>

<!-- View Mode Switcher -->
<div class="drawer-toggle-container" style="display: flex; gap: 4px; margin-bottom: 12px; background: #111; padding: 4px; border-radius: 4px;">
  <button id="view-chronological" class="view-btn active" style="flex: 1; padding: 6px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; background: #2e7d32; color: #fff;">Shift Order</button>
  <button id="view-domain" class="view-btn" style="flex: 1; padding: 6px; font-size: 0.75rem; border: none; border-radius: 3px; cursor: pointer; background: transparent; color: #aaa;">By Location</button>
</div>

<ul id="module-list-container" class="module-list"></ul>

<script>
  let currentViewMode = "chronological"; // "chronological" | "domain"

  function renderModuleList() {
    const listContainer = document.getElementById("module-list-container");
    listContainer.innerHTML = "";

    if (!window.QC_MODULES || window.QC_MODULES.length === 0) {
      listContainer.innerHTML = "<li style='color:#ef5350;'>No modules registered</li>";
      return;
    }

    if (currentViewMode === "chronological") {
      const sorted = [...window.QC_MODULES].sort((a, b) => a.shiftOrder - b.shiftOrder);
      sorted.forEach((item, index) => {
        const li = createModuleListItem(item);
        listContainer.appendChild(li);
        if (index === 0 && !window.QC.currentModule) {
          li.click();
        }
      });
    } else {
      const groups = {};
      window.QC_MODULES.forEach(item => {
        const groupName = item.locationGroup || "General";
        if (!groups[groupName]) groups[groupName] = [];
        groups[groupName].push(item);
      });

      Object.keys(groups).forEach(groupName => {
        const groupHeader = document.createElement("div");
        groupHeader.textContent = groupName;
        groupHeader.style.cssText = "font-size: 0.75rem; color: #81c784; text-transform: uppercase; margin: 12px 0 4px 4px; font-weight: bold;";
        listContainer.appendChild(groupHeader);

        groups[groupName].forEach(item => {
          const li = createModuleListItem(item);
          listContainer.appendChild(li);
        });
      });
    }
  }

  function createModuleListItem(item) {
    const li = document.createElement("li");
    li.textContent = item.title;

    li.onclick = async () => {
      document.querySelectorAll("#module-list-container li").forEach(el => el.classList.remove("active"));
      li.classList.add("active");

      try {
        await loadScript(item.script);
        const moduleData = window[item.objectName];
        if (moduleData) {
          window.QC.mountModule(moduleData);
          document.getElementById("nav-drawer").classList.remove("open");
          document.getElementById("nav-overlay").classList.remove("active");
        }
      } catch (err) {
        console.error(`Error loading module ${item.id}:`, err);
      }
    };

    return li;
  }

  // Toggle button event listeners
  document.getElementById("view-chronological").addEventListener("click", (e) => {
    currentViewMode = "chronological";
    e.target.style.background = "#2e7d32"; e.target.style.color = "#fff";
    document.getElementById("view-domain").style.background = "transparent"; document.getElementById("view-domain").style.color = "#aaa";
    renderModuleList();
  });

  document.getElementById("view-domain").addEventListener("click", (e) => {
    currentViewMode = "domain";
    e.target.style.background = "#2e7d32"; e.target.style.color = "#fff";
    document.getElementById("view-chronological").style.background = "transparent"; document.getElementById("view-chronological").style.color = "#aaa";
    renderModuleList();
  });
</script>
