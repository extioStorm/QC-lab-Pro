<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Lab Framework Engine</title>
  <link rel="stylesheet" href="framework-style.css">
  <style>
    .nav-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
      padding: 10px 16px;
      margin-bottom: 16px;
    }

    .nav-toggle-btn {
      background: none;
      border: 1px solid #444;
      color: #e0e0e0;
      font-size: 1.2rem;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .nav-drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 260px;
      height: 100%;
      background-color: #181818;
      border-right: 1px solid #333;
      box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .nav-drawer.open { left: 0; }

    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 999;
    }

    .nav-overlay.active { display: block; }

    .drawer-title {
      font-size: 1.1rem;
      color: #81c784;
      margin-top: 0;
      margin-bottom: 16px;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }

    .module-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .module-list li {
      padding: 10px;
      border-radius: 4px;
      color: #a0a0a0;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .module-list li:hover, .module-list li.active {
      background-color: #2e7d32;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <div class="nav-header-bar">
    <button id="menu-toggle" class="nav-toggle-btn">&#9776; Menu</button>
    <span style="font-weight: bold; font-size: 0.95rem;">QC Materials Testing</span>
    <span style="width: 24px;"></span>
  </div>

  <!-- Slide-out Drawer Navigation -->
  <div id="nav-drawer" class="nav-drawer">
    <h3 class="drawer-title">Test Modules</h3>
    <ul id="module-list-container" class="module-list"></ul>
  </div>

  <!-- Background Dim Overlay -->
  <div id="nav-overlay" class="nav-overlay"></div>

  <!-- Master Core Mount -->
  <div id="qc-framework-root"></div>

  <!-- Engine & Registry -->
  <script src="framework-engine.js"></script>
  <script src="modules/registry.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // 1. Initialize Framework Engine
      window.QC = new QCLabFramework("qc-framework-root");

      // 2. Setup Drawer Menu Controls
      const drawer = document.getElementById("nav-drawer");
      const overlay = document.getElementById("nav-overlay");
      const toggleBtn = document.getElementById("menu-toggle");

      toggleBtn.addEventListener("click", () => {
        drawer.classList.add("open");
        overlay.classList.add("active");
      });

      overlay.addEventListener("click", () => {
        drawer.classList.remove("open");
        overlay.classList.remove("active");
      });

      // 3. Load Modules Defined in registry.js
      const listContainer = document.getElementById("module-list-container");

      if (!window.QC_MODULES || window.QC_MODULES.length === 0) {
        listContainer.innerHTML = "<li>No modules in registry</li>";
        return;
      }

      for (let i = 0; i < window.QC_MODULES.length; i++) {
        const item = window.QC_MODULES[i];

        // Inject module script tag dynamically
        await loadScript(item.script);

        // Fetch instantiated module object
        const moduleData = window[item.objectName];

        if (moduleData) {
          const li = document.createElement("li");
          li.textContent = item.title;
          
          li.onclick = () => {
            document.querySelectorAll("#module-list-container li").forEach(el => el.classList.remove("active"));
            li.classList.add("active");
            window.QC.mountModule(moduleData);
            drawer.classList.remove("open");
            overlay.classList.remove("active");
          };

          listContainer.appendChild(li);

          // Mount first module as default view
          if (i === 0) {
            li.classList.add("active");
            window.QC.mountModule(moduleData);
          }
        }
      }
    });

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => {
          console.error(`Failed to load script: ${src}`);
          resolve(); // Resolve anyway so remaining app loads
        };
        document.body.appendChild(script);
      });
    }
  </script>
</body>
</html>
